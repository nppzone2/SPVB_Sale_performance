name: Cập nhật và đưa dashboard lên Pages

# Chạy khi có file mới trong input/ hoặc targets/ (trang gửi file và target tự động), khi sửa giao diện/engine, hoặc bấm Run workflow.
on:
  push:
    branches: [main]
    paths: ['input/**', 'targets/**', 'src/**', 'engine/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cài thư viện
        run: pip install openpyxl cryptography

      - name: Mã hoá và tạo trang từ dữ liệu trong input/
        env:
          SPVB_PASSWORD: ${{ secrets.SPVB_PASSWORD }}
        run: python engine/build.py

      - name: Bật GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Đưa lên Pages
        id: deployment
        uses: actions/deploy-pages@v4
